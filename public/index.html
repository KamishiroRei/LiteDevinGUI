<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f9fb">
<title>Devin Lite</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="main">
  <aside id="sidebar">
    <div class="side-head">
      <img class="logo" src="favicon.svg" width="26" height="26" alt="">
      <span class="side-title">Devin Lite</span>
      <button id="sidebarToggle" class="icon-btn side-toggle" type="button" title="收起侧边栏" aria-label="收起侧边栏">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 3v14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
    <button id="newBtn" class="new-sess" type="button">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8v6.4M4.8 8h6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      新会话 <span id="capacityBadge" class="capacity-badge" aria-label="Devin 并发状态">…/10</span>
    </button>
    <div class="ws-head">
      <span class="ws-label">工作区</span>
      <span class="spacer"></span>
      <button id="searchToggle" class="icon-btn" type="button" title="搜索会话" aria-label="搜索会话">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="reloadBtn" class="icon-btn" type="button" title="刷新会话列表" aria-label="刷新会话列表">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.5 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="session-tabs" role="tablist" aria-label="会话列表">
      <button id="activeSessionsTab" class="session-tab active" type="button" role="tab" aria-selected="true">会话</button>
      <button id="archivedSessionsTab" class="session-tab" type="button" role="tab" aria-selected="false">已归档 <span id="archiveCount"></span></button>
    </div>
    <div id="searchRow" hidden><input id="searchInput" placeholder="搜索标题、路径或 ID" spellcheck="false" aria-label="搜索会话"></div>
    <div id="sessionList"></div>
    <button id="moreBtn" class="mini" type="button" hidden>加载更多会话</button>
    <div class="side-footer">
      <span class="connection-dot" id="connectionDot"></span>
      <span class="agent" id="agentInfo">连接中…</span>
      <button id="restartAgentBtn" class="icon-btn" type="button" title="启动或重启 Devin" aria-label="启动或重启 Devin">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M16.5 7A6.5 6.5 0 1 0 17 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M16.5 3.5V7H13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M15.5 13.6A6.5 6.5 0 0 1 6.4 4.5 6.5 6.5 0 1 0 15.5 13.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <section id="chat">
    <div id="chatHead">
      <div class="chat-title-row">
        <button id="sidebarExpand" class="icon-btn" type="button" title="展开侧边栏" aria-label="展开侧边栏" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 3v14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <div class="chat-heading"><span id="chatTitle">开始使用 Devin Lite</span><span id="chatId" class="dim mono" title="点击复制会话 ID"></span></div>
        <span class="spacer"></span>
        <span id="busyBadge" class="run" hidden><i class="run-dot"></i>运行中</span>
        <span id="usageBadge" title="上下文用量"></span>
      </div>
      <div class="chat-subhead"><span class="chat-tab">对话</span><span id="optionBar"></span></div>
    </div>
    <div id="transcript"><div class="empty-state"><img src="favicon.svg" width="42" height="42" alt=""><h1>开始一个会话</h1><p>选择工作区，然后开始与 Devin 对话。</p><button class="primary empty-new" type="button">新建会话</button></div></div>
    <section id="queueBanner" class="queue-panel" aria-label="待处理消息" hidden>
      <div class="queue-head">
        <span class="queue-mark" aria-hidden="true">◷</span>
        <strong id="queueText" class="queue-text"></strong>
        <button id="queueToggle" class="queue-toggle" type="button" aria-expanded="true">收起</button>
      </div>
      <div id="queueList" class="queue-list"></div>
    </section>
    <div id="composerArea">
      <div id="composer">
        <div id="imageMentionMenu" class="image-mention-menu" role="listbox" aria-label="当前会话图片" hidden></div>
        <div id="attachChips" hidden></div>
        <textarea id="input" rows="2" placeholder="发消息给 Devin…" disabled></textarea>
        <div class="composer-row">
          <button id="attachBtn" class="icon-btn" type="button" title="引用本地文件" aria-label="引用本地文件">
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M14.3 8.1 9 13.4a2.9 2.9 0 0 1-4.1-4.1l6.2-6.2a4.1 4.1 0 0 1 5.8 5.8l-6.7 6.7a5.3 5.3 0 0 1-7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <span class="composer-tip">Enter 发送 · Shift+Enter 换行 · @ 可引用本会话图片</span>
          <span class="spacer"></span>
          <button id="stopBtn" class="stop-button" type="button" hidden>停止</button>
          <button id="sendBtn" class="send-button" type="button" disabled title="发送消息" aria-label="发送消息">
            <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="m4 10 6-6 6 6M10 4v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="composer-foot">Devin Lite 通过本机 Devin CLI 运行 · 结果请自行核对</div>
    </div>
  </section>
</div>
<dialog id="newSessionDialog" class="workspace-dialog" aria-labelledby="newSessionTitle">
  <div class="workspace-dialog-head">
    <div><h2 id="newSessionTitle">新建会话</h2><p>选择一个工作区，Devin 将在该目录中工作。</p></div>
    <button id="newSessionClose" class="icon-btn" type="button" aria-label="关闭新建会话窗口">×</button>
  </div>
  <div class="workspace-dialog-body">
    <section aria-label="已有工作区">
      <h3>已有工作区</h3>
      <div id="knownWorkspaces" class="known-workspaces"></div>
    </section>
    <section aria-label="选择其他目录">
      <h3>选择其他目录</h3>
      <div class="workspace-path-row">
        <input id="workspacePath" type="text" spellcheck="false" autocomplete="off" aria-label="工作区绝对路径" placeholder="输入或粘贴文件夹路径，例如 D:\devin-lite">
        <button id="workspaceLocate" type="button">定位</button>
      </div>
      <div class="workspace-browser-head">
        <button id="workspaceUp" type="button" aria-label="上一级目录">↑ 上一级</button>
        <span id="workspaceCurrent" class="mono"></span>
      </div>
      <div id="workspaceEntries" class="workspace-entries" role="list" aria-label="目录列表"></div>
    </section>
    <p id="workspaceError" class="workspace-error" role="alert" hidden></p>
  </div>
  <div class="workspace-dialog-foot">
    <span id="workspaceCapacity" class="dim"></span>
    <span class="spacer"></span>
    <button id="newSessionCancel" type="button">取消</button>
    <button id="newSessionCreate" class="primary" type="button">创建会话</button>
  </div>
</dialog>
<div id="toastRegion" aria-live="polite"></div>
<div id="imageHoverPreview" class="image-hover-preview" hidden></div>
<script src="app.js"></script>
</body>
</html>
