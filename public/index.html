<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devin-lite</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <span class="brand">devin-lite</span>
  <span class="agent" id="agentInfo">连接中…</span>
  <span class="spacer"></span>
  <span id="usageBadge" title="本会话当前上下文 token 数"></span>
  <span id="optionBar"></span>
</header>

<div id="main">
  <aside id="sidebar">
    <div class="side-head">
      <svg class="logo" viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="2" width="20" height="20" rx="5" fill="#5b5bd6"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="Segoe UI, sans-serif">D</text></svg>
      <span class="side-title">devin-lite</span>
    </div>
    <button id="newBtn" class="new-sess">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      新会话
    </button>
    <div class="ws-head">
      <span class="ws-label">工作区</span>
      <span class="spacer"></span>
      <button id="searchToggle" class="icon-btn" title="搜索会话">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="reloadBtn" class="icon-btn" title="刷新会话列表">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.5 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="searchRow" hidden>
      <input id="searchInput" placeholder="搜索会话标题…" spellcheck="false">
    </div>
    <div id="sessionList"></div>
    <button id="moreBtn" class="mini" hidden>加载更多…</button>
  </aside>

  <section id="chat">
    <div id="chatHead">
      <span id="chatTitle">未选择会话</span>
      <span id="chatId" class="dim mono" title="点击复制会话 ID"></span>
      <span class="spacer"></span>
      <span id="busyBadge" class="dim" hidden>运行中…</span>
    </div>
    <div id="transcript"></div>
    <div id="composer">
      <div id="attachChips" hidden></div>
      <textarea id="input" rows="3" placeholder="输入消息… Enter 发送，Shift+Enter 换行，可粘贴图片" disabled></textarea>
      <div class="row">
        <button id="attachBtn" class="mini" title="引用本地文件（发送路径给 devin）">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M11 3L5.5 8.5a2.1 2.1 0 0 0 3 3L14 6a3.5 3.5 0 0 0-5-5L3.5 6.5a4.9 4.9 0 0 0 7 7L15 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button id="sendBtn" class="primary" disabled>发送</button>
        <button id="stopBtn" class="danger" hidden>停止</button>
      </div>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
